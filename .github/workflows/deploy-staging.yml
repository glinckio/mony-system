# Deploy da API e do worker em staging a cada merge na main (docs/arquitetura/12, T-156): imagem
# ARM → ECR, depois o `infra/servidor/atualizar.sh` no servidor pelo SSM (migrações e seed, troca da
# API com health check e volta para a anterior, troca do worker). Só roda depois que a infra
# existir e as variáveis STAGING_* estiverem no repositório (infra/README.md). Sem elas, o job é
# pulado.
name: Deploy de staging

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .dockerignore
      - infra/servidor/atualizar.sh
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: API em staging
    if: vars.STAGING_AWS_PAPEL_DEPLOY != ''
    # O servidor é ARM (Graviton): a imagem é feita num runner ARM, sem emulação.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    # O papel da AWS só aceita jobs deste ambiente (infra/modulos/servidor-unico/deploy.tf).
    environment: staging
    env:
      SERVIDOR: ${{ vars.STAGING_SERVIDOR }}
      REPOSITORIO: ${{ vars.STAGING_ECR_REPOSITORIO }}
      # Sentry (T-142c): sem o token, os source maps não são enviados (infra/README.md, "Sentry").
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Entrar na AWS (OIDC, sem chave guardada)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STAGING_AWS_PAPEL_DEPLOY }}
          aws-region: ${{ vars.STAGING_AWS_REGIAO }}

      - name: Entrar no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publicar a imagem (tag do commit e tag staging)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.REPOSITORIO }}:${{ github.sha }}
            ${{ env.REPOSITORIO }}:staging
          # A release do Sentry é o commit (T-142c).
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,scope=api-arm64,mode=max

      - name: Source maps da API e do worker no Sentry
        # Os arquivos saem da própria imagem, que já tem os IDs de depuração (Dockerfile). Uma falha
        # aqui não impede o deploy: só deixa a pilha dos erros sem o código-fonte.
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        run: |
          docker pull "$REPOSITORIO:$GITHUB_SHA"
          conteiner=$(docker create "$REPOSITORIO:$GITHUB_SHA")
          docker cp "$conteiner:/app/dist" ./dist-api
          docker rm "$conteiner"
          for projeto in api worker; do
            npx --yes @sentry/cli@2.58.4 sourcemaps upload --org "$SENTRY_ORG" \
              --project "$projeto" --release "$GITHUB_SHA" ./dist-api
          done

      - name: Atualizar o servidor
        # Manda o script pelo Run Command (rodado com bash, não com o sh do documento) e acompanha
        # até o fim. O script migra, troca a API (volta
        # para a anterior se a nova não responder o health check) e troca o worker.
        run: |
          parametros=$(jq -n --rawfile script infra/servidor/atualizar.sh --arg versao "$GITHUB_SHA" \
            '{commands: ["AMBIENTE=staging VERSAO=\($versao) bash -s <<'"'"'MONY_FIM'"'"'\n\($script)MONY_FIM"], executionTimeout: ["1800"]}')
          comando=$(aws ssm send-command --instance-ids "$SERVIDOR" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --parameters "$parametros" \
            --query Command.CommandId --output text)
          echo "Comando: $comando"
          for _ in $(seq 1 180); do
            sleep 10
            estado=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$SERVIDOR" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$estado" in Pending | InProgress | Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$SERVIDOR" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          if [ "$estado" != "Success" ]; then
            echo "::error title=Deploy de staging falhou::Estado do comando: $estado. Veja a saída acima."
            exit 1
          fi
          echo "::notice title=Staging atualizado::Imagem ${GITHUB_SHA::7} no ar (api e worker)."
