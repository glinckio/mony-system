# Verificação de todo PR e de todo push na main (docs/arquitetura/12 e 14).
# O check "Verificar" é obrigatório para mergear na main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar pnpm (versão do packageManager) com cache do store
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cache do Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação (Prettier)
        run: pnpm format:check

      - name: Build, lint, typecheck e testes
        run: pnpm turbo run build lint typecheck test
