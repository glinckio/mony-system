# Verificação de todo PR e de todo push na main (docs/arquitetura/12 e 14).
# O check "Verificar" é obrigatório para mergear na main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar pnpm (versão do packageManager) com cache do store
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cache do Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação (Prettier)
        run: pnpm format:check

      - name: Build, lint, typecheck e testes
        run: pnpm turbo run build lint typecheck test

      - name: Arquivos gerados commitados
        # O build regera arquivos que ficam no Git (ex.: rotas do admin em apps/admin/src/rotas.gen.ts).
        # Diferença aqui quer dizer que alguém mudou a origem e não commitou o gerado.
        run: |
          mudancas=$(git status --porcelain)
          if [ -n "$mudancas" ]; then
            echo "$mudancas"
            arquivos=$(echo "$mudancas" | awk '{print $2}' | paste -sd ' ')
            echo "::error title=Arquivo gerado desatualizado::Rode pnpm build e commite. Arquivos: $arquivos"
            exit 1
          fi

      - name: Cliente da API em dia com o contrato
        # Exporta o OpenAPI da API e gera o @mony/api-client de novo; qualquer diferença quer dizer
        # que o contrato mudou e o cliente commitado ficou para trás (doc 02, T-009).
        run: |
          pnpm --filter @mony/api-client generate
          mudancas=$(git status --porcelain -- packages/api-client)
          if [ -n "$mudancas" ]; then
            arquivos=$(echo "$mudancas" | awk '{print $2}' | paste -sd ' ')
            echo "::error title=Cliente da API desatualizado::Rode pnpm --filter @mony/api-client generate e commite. Arquivos: $arquivos"
            exit 1
          fi

  # Terraform (formatação e validação, sem tocar na AWS) e a imagem da API compilando (doc 12).
  infra:
    name: Infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: mony
          POSTGRES_PASSWORD: mony-ci
          POSTGRES_DB: mony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mony -d mony"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform formatado
        run: |
          if ! terraform fmt -check -recursive infra > /dev/null; then
            diferenca=$(terraform fmt -recursive -diff infra | grep -E '^(---|\+\+\+|[-+] )' | head -n 80)
            printf '::error title=Terraform sem formatação::Rode terraform fmt -recursive infra.%%0A%s\n' \
              "$(echo "$diferenca" | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi

      - name: Terraform válido
        # Os erros viram anotações com arquivo e linha, para aparecer no resumo do CI.
        run: |
          falhou=0
          for pasta in infra/bootstrap infra/ambientes/staging; do
            if ! saida=$(terraform -chdir="$pasta" init -backend=false -input=false -no-color 2>&1); then
              printf '::error title=terraform init em %s::%s\n' "$pasta" \
                "$(echo "$saida" | grep -v '^$' | tail -n 30 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
              falhou=1
              continue
            fi
            resultado=$(terraform -chdir="$pasta" validate -json -no-color || true)
            echo "$resultado" | jq -r --arg pasta "$pasta" '.diagnostics[] |
              "::\(if .severity == "error" then "error" else "warning" end) file=\($pasta)/\(.range.filename // ""),line=\(.range.start.line // 1),title=\(.summary | gsub("[:,]"; " "))::\(.detail // .summary | gsub("%"; "%25") | gsub("\n"; "%0A"))"'
            if [ "$(echo "$resultado" | jq -r .valid)" != "true" ]; then
              falhou=1
            fi
          done
          exit $falhou

      - name: Imagem da API compila
        run: |
          set -o pipefail
          if ! docker build -f apps/api/Dockerfile -t mony-api:ci --progress plain . 2>&1 | tee /tmp/build.log; then
            printf '::error title=Imagem da API não compila::%s\n' \
              "$(grep -v '^$' /tmp/build.log | tail -n 60 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi

      - name: Imagem da API sobe
        # Sem banco e sem Redis de verdade a API sobe e responde o health check (conexões são preguiçosas).
        run: |
          docker run -d --name api -p 3000:3000 \
            -e DATABASE_URL=postgresql://x:y@127.0.0.1:5432/z -e REDIS_URL=redis://127.0.0.1:6379 mony-api:ci
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:3000/v1/health; then
              echo
              docker run --rm --entrypoint node mony-api:ci -e "require('fs').accessSync('dist/worker.js')"
              exit 0
            fi
            sleep 1
          done
          printf '::error title=Imagem da API não respondeu::%s\n' \
            "$(docker logs api 2>&1 | tail -n 30 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          exit 1

      - name: Migração e seed pela imagem
        # O mesmo comando que o deploy roda na tarefa avulsa, contra um Postgres vazio.
        run: |
          if ! saida=$(docker run --rm --network host \
            -e DATABASE_URL=postgresql://mony:mony-ci@localhost:5432/mony \
            mony-api:ci sh -c "prisma migrate deploy && prisma db seed" 2>&1); then
            printf '::error title=Migração pela imagem falhou::%s\n' \
              "$(echo "$saida" | tail -n 40 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi
          echo "$saida" | tail -n 5

  # Migrações do Prisma e testes de integração com Postgres e Redis de verdade (doc 12 e 14).
  # O check "Banco" também é obrigatório para mergear na main.
  banco:
    name: Banco
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # Imagens oficiais pelo espelho da AWS: o Docker Hub recusou pulls do runner em 09/10/2026.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: mony
          POSTGRES_PASSWORD: mony-ci
          POSTGRES_DB: mony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mony -d mony"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: public.ecr.aws/docker/library/redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HUSKY: '0'
      DATABASE_URL: postgresql://mony:mony-ci@localhost:5432/mony
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar pnpm (versão do packageManager) com cache do store
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Schema válido
        run: pnpm --filter api exec prisma validate

      - name: Migrações aplicam em banco limpo
        run: pnpm --filter api exec prisma migrate deploy

      - name: Schema e migrações batem
        id: diferenca
        # Chama o binário direto: o `pnpm exec` troca o código 2 ("há diferença") por 1.
        working-directory: apps/api
        run: |
          set +e
          ./node_modules/.bin/prisma migrate diff --from-config-datasource \
            --to-schema prisma/schema.prisma --script --exit-code \
            > "$RUNNER_TEMP/faltando.sql" 2> "$RUNNER_TEMP/erro.txt"
          codigo=$?
          set -e
          if [ "$codigo" = "2" ]; then
            echo "::error title=Migração faltando::O schema.prisma tem mudanças sem migração. Rode: pnpm --filter api prisma migrate dev --name <nome>"
            echo "faltando=sim" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$codigo" != "0" ]; then
            # Publica o erro como anotação, legível pela API sem baixar o log.
            mensagem=$(cat "$RUNNER_TEMP/erro.txt" "$RUNNER_TEMP/faltando.sql" | head -c 4000 \
              | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=prisma migrate diff falhou::$mensagem"
          fi
          exit "$codigo"

      - name: Comentar no PR o SQL da migração que falta
        if: failure() && steps.diferenca.outputs.faltando == 'sim' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          ruido = ('Loaded Prisma config', 'Prisma schema loaded', 'Datasource')
          linhas = [l for l in open(os.path.join(os.environ['RUNNER_TEMP'], 'faltando.sql'))
                    if not l.startswith(ruido)]
          partes, atual = [], ''
          for linha in linhas:
              if len(atual) + len(linha) > 60000:
                  partes.append(atual)
                  atual = ''
              atual += linha
          if atual:
              partes.append(atual)
          for i, sql in enumerate(partes, 1):
              corpo = (
                  f"<!-- migracao-sugerida sha={os.environ['SHA']} parte={i}/{len(partes)} -->\n"
                  f"**Migração faltando** (parte {i} de {len(partes)}). O `schema.prisma` mudou e "
                  "nenhuma migração cobre a mudança. O normal é rodar "
                  "`pnpm --filter api prisma migrate dev --name <nome>` com o banco local; "
                  "o SQL abaixo é o que o Prisma gera a partir das migrações existentes.\n\n"
                  f"```sql\n{sql}```\n"
              )
              subprocess.run(['gh', 'pr', 'comment', os.environ['PR'], '--body-file', '-'],
                             input=corpo.encode(), check=True)
          PY

      - name: Gerar o Prisma Client e compilar a API e suas dependências
        run: pnpm turbo run build --filter=api

      - name: Seed (duas vezes, para provar que pode repetir)
        run: |
          for vez in 1 2; do
            if ! pnpm --filter api seed > "$RUNNER_TEMP/seed.txt" 2>&1; then
              mensagem=$(tail -c 4000 "$RUNNER_TEMP/seed.txt" | sed -e 's/%/%25/g' \
                | sed -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Seed falhou (vez $vez)::$mensagem"
              exit 1
            fi
            grep -E "Limites|demonstração" "$RUNNER_TEMP/seed.txt"
          done

      - name: Testes de integração (Postgres e Redis)
        env:
          TESTES_INTEGRACAO: '1'
          NO_COLOR: '1'
        # O relator github-actions publica cada falha como anotação; o resumo sai como aviso
        # (notice), para conferir pela API que os testes de integração rodaram e não foram pulados.
        run: |
          set -o pipefail
          pnpm --filter api exec vitest run --reporter=default --reporter=github-actions \
            | tee "$RUNNER_TEMP/vitest.txt"
          resumo=$(grep -E "(Test Files|Tests) " "$RUNNER_TEMP/vitest.txt" | tr -s ' ' | paste -sd ';' || true)
          echo "::notice title=Testes da API com Postgres e Redis::$resumo"
