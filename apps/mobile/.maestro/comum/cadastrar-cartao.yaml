# Preenche e salva o formulário do cartão na aba Cartões. Entrada: INICIO (o botão que abre o
# formulário) e NOME.
appId: com.monitorizze.app.preview
---
- tapOn: ${INICIO}
- tapOn:
    id: campo-nome
- inputText: ${NOME}
- tapOn:
    id: campo-limiteCentavos
- inputText: '500000'
- tapOn:
    id: campo-diaFechamento
- inputText: '10'
- tapOn:
    id: campo-diaVencimento
- inputText: '20'
- hideKeyboard
- scrollUntilVisible:
    element: Salvar
- tapOn: Salvar
