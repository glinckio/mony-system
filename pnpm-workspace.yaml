  - '@expo/ui@57.0.23 || 57.0.24 || 57.0.25'
  - babel-preset-expo@57.0.15 || 57.0.16 || 57.0.17
  - expo-crypto@57.0.4
  - expo-dev-client@57.0.20 || 57.0.21
  - expo-dev-launcher@57.0.21 || 57.0.22
  - expo-dev-menu@57.0.20 || 57.0.21
  - expo-modules-autolinking@57.0.15 || 57.0.16 || 57.0.17
  - expo-modules-core@57.0.22 || 57.0.23 || 57.0.25
  - expo-modules-jsi@57.1.2
  - expo-router@57.0.26 || 57.0.27 || 57.0.28 || 57.0.30
  - expo-splash-screen@57.0.10 || 57.0.11
  - expo-updates@57.0.26 || 57.0.27
  - expo@57.0.28 || 57.0.29 || 57.0.30 || 57.0.32
  - jest-expo@57.0.6
  - '@expo/metro-runtime@57.0.17 || 57.0.18'
