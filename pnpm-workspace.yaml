packages:
  - apps/*
  - packages/*
  - modules/*
# Versões que precisam ser iguais em todo o monorepo. O app usa o React exato do SDK do Expo, e o
# `@mony/api-client` precisa enxergar o mesmo React e o mesmo TanStack Query que o app (senão o
# Metro empacota duas cópias e o `QueryClientProvider` do app não vale para os hooks gerados).
catalog:
  '@tanstack/react-query': 5.106.1
  '@types/react': 19.2.18
  react: 19.2.3
  react-dom: 19.2.3
  react-test-renderer: 19.2.3
# Pacotes que trazem `react-dom` como dependência opcional (ex.: Prisma Studio, react-i18next) usam
# a mesma versão do React do catálogo.
overrides:
  react-dom: 'catalog:'
  # O @nestjs/platform-fastify 11.2.7 fixa o 5.11.3, que tem falhas altas corrigidas no 5.12.2
  # (`pnpm audit`, T-144a). Igual à versão de `apps/api`; tirar quando o Nest subir a dele.
  fastify: 5.12.7
  # A CLI do Prisma 7.10 fixa versões com falhas altas (`pnpm audit`, T-144d): o mysql2 3.15.3
  # (GHSA-3f6p-5ww8-9rcr) e, pela @prisma/config, o deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx).
  # Tirar quando o Prisma subir as dele.
  mysql2: 3.24.6
  deepmerge-ts: 8.0.2
  # O node-forge ≤ 1.4.0 tem falhas altas (GHSA-7wch-p9px-956x, GHSA-jc66-7q78-782g e outras,
  # T-HOTFIX de 2026-11-04), corrigidas no 1.4.1. A CLI do Expo pede `^1.3.3`. Tirar quando o Expo
  # subir a dele.
  node-forge: 1.4.2
# Falhas altas sem versão corrigida publicada em 17/10/2026 (`pnpm audit`, T-144d). As duas estão
# em ferramentas que rodam só no desenvolvimento e no build, não no app nem na API. Rever a cada SDK
# do Expo e tirar daqui quando sair a correção.
auditConfig:
  ignoreGhsas:
    # braces ≤ 3.0.3, no micromatch do Metro: estouro de pilha com padrão de chaves muito aninhado.
    # Os padrões vêm da configuração do projeto, não de quem usa o app.
    - GHSA-vfj7-8cjw-p6xm
    # Publicadas em 29/10/2026, com correção que não serve aqui (T-HOTFIX de 2026-10-29):
    # zod < 4.6.6, no zod 3 da CLI do Expo (`@expo/cli` pede `^3.25.76`, e o zod 3 não terá
    # correção): esgota memória ao validar coleções enormes. Só valida a configuração do projeto.
    - GHSA-mrhx-c7xc-m3w5
    # decode-uri-component ≤ 0.5.0, no query-string 7 do expo-router: decodificar um link com muitos
    # `%` seguidos é quadrático. O 0.5.1 corrige, mas é só ESM e quebra o `require` do query-string 7.
    # No pior caso, um link forjado aberto no próprio aparelho trava o app daquela pessoa. Tirar
    # quando o expo-router subir o query-string.
    - GHSA-qr28-fpjm-wq7f
allowBuilds:
  '@prisma/engines': false
  '@scarf/scarf': false
  '@sentry/cli': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  prisma: false
# O pnpm só instala versão publicada há mais de um dia. Exceção: os patches do SDK do Expo que o
# `expo install --check` do CI passa a exigir no dia em que saem (DECISOES, T-HOTFIX de 2026-10-12).
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.29 || 57.0.30 || 57.0.31 || 57.0.33'
  - '@expo/fingerprint@0.20.14 || 0.20.15'
